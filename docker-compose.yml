services:
  mysql:
    image: mysql:8.4
    container_name: stock-mysql
    restart: unless-stopped
    # command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command: --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/stock.sql:/docker-entrypoint-initdb.d/01-stock.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 30s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_NAME: ${APP_NAME:-stock-app}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      ALPHA_API_KEY: ${ALPHA_API_KEY}
      ALPHA_BASE_URL: ${ALPHA_BASE_URL:-https://www.alphavantage.co/query}
      SYNC_SYMBOLS: ${SYNC_SYMBOLS:-MSFT,AAPL,META}
      SYNC_CRON: ${SYNC_CRON:-*/30 * * * *}
      SYNC_RUN_ON_START: ${SYNC_RUN_ON_START:-true}
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/health" ]
      interval: 10m
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
volumes:
  mysql_data:
